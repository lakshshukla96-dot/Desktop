<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width , initial-scale=1">
    <head></head>


<!--head tag is also known as meta tag which is above all tags-->
    

<body>

    <strong><big>TABLES</big></strong><br><br> 
        <table border="4px" cellspacing="1px" cellpadding="10px">
            <tr>
            <th colspan="2">Roll No </th>
            <th rowspan="2">Name </th>
            </tr>
            <tr>
                <td> 1 </td>
                <td>Neha</td>
                
            </tr>
            <tr>
                <td>2</td>
                <td colspan="2">3456789032</td>
            </tr>
        </table>
<br>
<strong><big>FORMS </big></strong><br><br>
        <form> 
            <fieldset>
                <legend> MY FORM </legend><br> 
            Name : <input type="text"><br><br>
         Father's Name : <input type="text"><br> <br>
         Password : <input type="password"><br><br>
         DOB: <input type="date"><br><br>
         Mobile No. : <input type="number"><br><br>
         Email : <input type="email"><br><br>
         Gender : <input type="radio" name="Gender">Male
         <input type="radio" name="Gender">Female 
         <input type="radio" name="Gender">Others<br><br>
         Qualifications : <input type="checkbox">10th
         <input type="checkbox">12th<br><br>
         Select States : <select>
            <option value="ABC">Select States</option>
            <option value="UP">Uttar Pradesh</option>
            <option value="JK">Jharkhand</option>
         </select><br><br>
         RMS  <textarea rows="3" col="5"></textarea><br> <br>
         <input type="submit">
         <input type="reset">
         <button>Login</button><br> <br>
         <input type="file">
         <br><br>
         Choose the color <input type="color" id="colorpicker"
         onchange="document.body.style.backgroundColor=this.value">
</fieldset>
        </form>
    </body>
</html>
